# The OpenTelemetry Collector — the one process between the API and the storage backends.
#
# It exists so the API talks to ONE endpoint and never to Tempo, Prometheus or (from M3)
# Loki directly. Swapping a backend then changes this file rather than the application's
# configuration, and the application keeps exporting OTLP whatever is behind it.
#
# Deliberately discrete containers rather than the bundled `grafana/otel-lgtm` image: the
# topology is the thing being demonstrated, and an all-in-one image hides exactly the wiring
# an operator has to understand. It is also not what anyone runs in production.

receivers:
  otlp:
    protocols:
      # Both wire protocols, though only HTTP is used today. The API's exporter is
      # OTLP/HTTP (`@opentelemetry/exporter-trace-otlp-http`) because it needs no gRPC
      # runtime under Bun; gRPC is accepted so a future sidecar or a k6 extension does not
      # need this file changed.
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Ordered deliberately, and the order is the standard one for a reason: the limiter has
  # to be able to refuse data BEFORE the batcher has spent memory assembling it.
  memory_limiter:
    check_interval: 1s
    # The collector is a shock absorber, not a queue. When Tempo is slow it must shed load
    # and say so rather than growing until the container is OOM-killed — the same principle
    # as the API's bounded, drop-on-full span queue.
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  # `otlp_grpc`, not the bare `otlp` alias — the collector deprecated that spelling and
  # warns about it on every boot, and a config that warns on boot trains people to skip
  # the boot logs.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      # Plaintext INSIDE the compose network only. Nothing here is published to a host
      # port; the collector is the only thing that talks to Tempo.
      insecure: true

  # Application metrics, on a SECOND port for Prometheus to scrape (M3, ADR-0041).
  #
  # A scrape rather than a remote-write, deliberately. It is the topology already in use —
  # Prometheus scrapes 8888 below for the collector's own telemetry — so M3 adds a target
  # instead of a mechanism, and it preserves this file's stated rule that the API talks to
  # ONE endpoint and never to Prometheus directly. The exporter holds the last value of
  # each series in memory and answers on demand; a scrape that is late reads a stale value
  # rather than losing one, which is the tradeoff a pull model makes on purpose.
  #
  # Names are translated on the way out: OTel's dotted `labelloop.judge.cost_usd` becomes
  # Prometheus's `labelloop_judge_cost_usd_total`, and `http.server.request.duration`
  # becomes `http_server_request_duration_seconds_bucket`. Each convention stays correct on
  # its own side of this line, which is why the SDK spells its names the OTel way.
  prometheus/app:
    endpoint: 0.0.0.0:8889
    # LEFT OFF, and it is a cardinality decision rather than a default. Enabling it copies
    # every resource attribute — `service.version`, `labelloop.git_sha`, the environment —
    # onto every series, which multiplies the whole series set on each deploy. The
    # information is not lost: the exporter publishes `target_info` carrying exactly those
    # attributes, and a panel that needs the build joins to it
    # (`... * on(job, instance) group_left(service_version) target_info`). That is OTel's
    # own answer to this question, and it is the reason both signals share one Resource.
    resource_to_telemetry_conversion:
      enabled: false

service:
  telemetry:
    logs:
      level: info
    metrics:
      # The collector's own metrics, for Prometheus to scrape. This is how "are spans being
      # dropped" becomes a number rather than a suspicion — `otelcol_processor_dropped_spans`
      # and `otelcol_exporter_send_failed_spans` are the two that matter.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    # The same receiver and the same two processors as traces, in the same order and for
    # the same reason: whatever the signal, the limiter has to be able to refuse data
    # before the batcher spends memory assembling it.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus/app]
  # No logs pipeline yet. ADR-0007's amendment puts the filelog receiver → Loki at M3;
  # until then logs are NDJSON on stdout and `docker compose logs` is the reader.
