# The OpenTelemetry Collector — the one process between the API and the storage backends.
#
# It exists so the API talks to ONE endpoint and never to Tempo, Prometheus or (from M3)
# Loki directly. Swapping a backend then changes this file rather than the application's
# configuration, and the application keeps exporting OTLP whatever is behind it.
#
# Deliberately discrete containers rather than the bundled `grafana/otel-lgtm` image: the
# topology is the thing being demonstrated, and an all-in-one image hides exactly the wiring
# an operator has to understand. It is also not what anyone runs in production.

receivers:
  # **Logs are collected OUT OF PROCESS, and that asymmetry is the decision** (ADR-0007's
  # 2026-08-20 amendment, CONVENTIONS' "zero pino transports, ever").
  #
  # The API ships nothing. It writes raw NDJSON to stdout and Docker writes that to a file;
  # this receiver tails the file. In-process shipping would couple API availability to the
  # log backend — a slow or unreachable Loki would block the request path, buffer without
  # bound, or drop silently — and it loses whatever is buffered when the process crashes,
  # which is exactly the moment the lines matter most.
  #
  # The asymmetry with traces and metrics is principled rather than inconsistent: spans have
  # no stdout convention, so the SDK exports them over OTLP with a bounded, drop-on-full
  # processor. Logs have a universal one, so the platform owns delivery. 12-factor XI.
  # `file_log`, not the bare `filelog` alias — deprecated, and this file's existing rule
  # about `otlp_grpc` applies identically: a config that warns on every boot trains people
  # to skip the boot logs.
  file_log:
    include: ['/var/lib/docker/containers/*/*-json.log']
    # A restart re-reads from where it stopped rather than from the top of every file.
    start_at: end
    include_file_path: true
    include_file_name: false
    # `poll_interval` rather than inotify: the log directory lives inside Docker Desktop's
    # VM, and filesystem events do not cross that boundary reliably.
    poll_interval: 500ms
    operators:
      # 1. Unwrap Docker's json-file envelope: {"log":"...","stream":"stdout","time":"..."}
      - type: json_parser
        id: docker
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'

      # 2. Which container this came from. The file PATH is the only place the id appears —
      # the line itself has no idea. Truncated to 12 characters, the same short form
      # `docker ps` prints, because a 64-character hex string as a stream label is a
      # readability problem rather than a cardinality one.
      - type: regex_parser
        id: container-id
        parse_from: attributes["log.file.path"]
        regex: '^/var/lib/docker/containers/(?P<container_id>[a-f0-9]{12})[a-f0-9]*/'

      # 3. The unwrapped line becomes the body, so the next parser sees pino's JSON.
      - type: move
        from: attributes.log
        to: body

      # 4. Parse the application's own line. `if` guards it: not every container in this
      #    stack writes JSON — Loki, Tempo and Prometheus write logfmt and plain text — and
      #    a parser that failed on those would fill the collector's own log with errors
      #    about lines it was never meant to understand. Non-JSON bodies pass through whole.
      - type: json_parser
        id: pino
        if: 'body matches "^\\{"'
        parse_from: body
        severity:
          # pino writes the LEVEL AS A NUMBER, so this maps its numbers onto OTel's
          # severities rather than parsing words. `severity_text` keeps pino's own `30`,
          # which is what the OTel spec asks for — the source's own representation — while
          # `severity_number` becomes 9, which is what anything filtering by level reads.
          parse_from: attributes.level
          mapping:
            debug: 20
            info: 30
            warn: 40
            error: 50
            fatal: 60

      # 5. **Promote two fields to RESOURCE attributes, because only those become Loki
      #    stream labels.** Everything else the parser produced stays a log-record
      #    attribute and lands in structured metadata — queryable, but not a stream.
      #
      #    That distinction is the whole cardinality design and it is easy to get wrong in
      #    a way that looks like it works: a `resource` PROCESSOR cannot do this, because it
      #    reads resource attributes and these are log-record attributes at this point. The
      #    symptom is silent — every line ingests fine under `service_name="unknown_service"`
      #    and you notice when a query by service returns nothing.
      - type: move
        id: service-name
        # Only the API writes this field. Other containers keep `unknown_service`, which is
        # honest: they are not this application and have no service name of their own.
        if: 'attributes.service != nil'
        from: attributes.service
        to: resource["service.name"]
      - type: move
        id: container-label
        # Bounded by the number of containers in the stack, which is what makes it safe as a
        # label — unlike `request_id`, which is unique per request and stays metadata.
        from: attributes.container_id
        to: resource["container_id"]

  otlp:
    protocols:
      # Both wire protocols, though only HTTP is used today. The API's exporter is
      # OTLP/HTTP (`@opentelemetry/exporter-trace-otlp-http`) because it needs no gRPC
      # runtime under Bun; gRPC is accepted so a future sidecar or a k6 extension does not
      # need this file changed.
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Ordered deliberately, and the order is the standard one for a reason: the limiter has
  # to be able to refuse data BEFORE the batcher has spent memory assembling it.
  memory_limiter:
    check_interval: 1s
    # The collector is a shock absorber, not a queue. When Tempo is slow it must shed load
    # and say so rather than growing until the container is OOM-killed — the same principle
    # as the API's bounded, drop-on-full span queue.
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024


exporters:
  # `otlp_grpc`, not the bare `otlp` alias — the collector deprecated that spelling and
  # warns about it on every boot, and a config that warns on boot trains people to skip
  # the boot logs.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      # Plaintext INSIDE the compose network only. Nothing here is published to a host
      # port; the collector is the only thing that talks to Tempo.
      insecure: true

  # Application metrics, on a SECOND port for Prometheus to scrape (M3, ADR-0041).
  #
  # A scrape rather than a remote-write, deliberately. It is the topology already in use —
  # Prometheus scrapes 8888 below for the collector's own telemetry — so M3 adds a target
  # instead of a mechanism, and it preserves this file's stated rule that the API talks to
  # ONE endpoint and never to Prometheus directly. The exporter holds the last value of
  # each series in memory and answers on demand; a scrape that is late reads a stale value
  # rather than losing one, which is the tradeoff a pull model makes on purpose.
  #
  # Names are translated on the way out: OTel's dotted `labelloop.judge.cost_usd` becomes
  # Prometheus's `labelloop_judge_cost_usd_total`, and `http.server.request.duration`
  # becomes `http_server_request_duration_seconds_bucket`. Each convention stays correct on
  # its own side of this line, which is why the SDK spells its names the OTel way.
  # Loki over OTLP, not the collector's old `loki` exporter — that one is deprecated and on
  # its way out, and Loki 3 ingests OTLP natively. It also gives the mapping we want for
  # free: RESOURCE attributes become stream labels, and log-record attributes become
  # structured metadata.
  #
  # That split is the whole cardinality story, and it is the same argument ADR-0042 makes
  # about metric labels. `request_id` is unique per HTTP request, so a stream label carrying
  # it would mint a stream per call and take Loki down inside a day. As structured metadata
  # it stays queryable — and queryable is all the Tempo link needs.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  prometheus/app:
    endpoint: 0.0.0.0:8889
    # LEFT OFF, and it is a cardinality decision rather than a default. Enabling it copies
    # every resource attribute — `service.version`, `labelloop.git_sha`, the environment —
    # onto every series, which multiplies the whole series set on each deploy. The
    # information is not lost: the exporter publishes `target_info` carrying exactly those
    # attributes, and a panel that needs the build joins to it
    # (`... * on(job, instance) group_left(service_version) target_info`). That is OTel's
    # own answer to this question, and it is the reason both signals share one Resource.
    resource_to_telemetry_conversion:
      enabled: false

service:
  telemetry:
    logs:
      level: info
    metrics:
      # The collector's own metrics, for Prometheus to scrape. This is how "are spans being
      # dropped" becomes a number rather than a suspicion — `otelcol_processor_dropped_spans`
      # and `otelcol_exporter_send_failed_spans` are the two that matter.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    # The same receiver and the same two processors as traces, in the same order and for
    # the same reason: whatever the signal, the limiter has to be able to refuse data
    # before the batcher spends memory assembling it.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus/app]
    # The third signal, and the only pipeline whose receiver is not `otlp` — because the
    # application does not send its logs anywhere. It writes them to stdout and this
    # collector goes and gets them.
    logs:
      receivers: [file_log]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
