# Tempo, single-binary, local storage. Traces only — Tempo is not a metrics store, which is
# why Prometheus is a separate container rather than a setting in this file.

server:
  http_listen_port: 3200
  # The collector sends over gRPC on 4317; nothing else talks to Tempo.
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Short on purpose for a development stack: a trace should be queryable seconds after the
  # request that produced it, because the demo is "make a call, then find it". Production
  # would trade this the other way.
  max_block_duration: 5m

compactor:
  compaction:
    # **Three hours, and the number comes from evidence** (M3 phase 5, the soak).
    #
    # M0 left this at 24h and deferred the decision to "when there is a reason to keep a
    # trace for longer than a debugging session". The reason arrived from the other
    # direction: `docs/BREAKING_POINT.md` §4 records that the ONLY thing to fall over in M2
    # was accumulated trace state on a stack that had been up for two days — the k6
    # container OOM'd against Docker's 7.65 GiB while Tempo held the memory. Not the API,
    # not under peak load; the trace store, after days.
    #
    # The soak sized the steady state: 78 minutes at 0.75 req/s (~2.25 spans/s) held Tempo
    # between 216 and 340 MiB, with the compactor visibly reclaiming — its final half hour
    # trended at -97 MiB/h. So Tempo is well behaved over a session and the exposure is
    # purely cumulative, which is exactly what retention controls.
    #
    # Three hours is chosen to match what a trace is FOR here: the demo is "make a call,
    # then find it", and a debugging session is minutes. It keeps a local stack's worst case
    # an eighth of what it was, and production — where a trace is worth keeping longer and
    # the store is not sharing a laptop with everything else — would set this differently
    # and say so.
    block_retention: 3h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# The metrics generator, ON as of M3 — and explicitly NOT AUTHORITATIVE (ADR-0041).
#
# It turns spans into RED metrics and remote-writes them to Prometheus. Two things are true
# at once and both are the decision:
#
#   1. It is enabled because without a generator Grafana's Traces Drilldown answers
#      `error finding generators: empty ring` and is simply broken. Two blocks of
#      configuration to fix that is a good trade.
#   2. **No dashboard is built on these series.** The application emits its own metrics
#      through its own MeterProvider, and those are the ones every panel and the one alert
#      rule read. Cardinality is then decided where a metric is DEFINED rather than
#      inferred from whatever attributes a span happened to carry — which is what makes
#      ADR-0042's "no identifier is ever a label" a rule that can be enforced at all.
#
# `external_labels` is how the two are told apart: everything from here carries
# `source="tempo"`, so a query can never quietly mix a generated series with a real one.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      # Prometheus runs with `--web.enable-remote-write-receiver` for this one writer and
      # nothing else. The API does not remote-write and never will: it talks to the
      # collector, which is the rule the collector's own config states.
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      # `local-blocks` is the one Traces Drilldown actually needs — the RED processors are
      # what the generator is famous for, and the drilldown's own queries run against
      # locally retained blocks.
      processors: [service-graphs, span-metrics, local-blocks]
