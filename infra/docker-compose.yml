# The base stack. This is the file the one-command demo runs and the file CI composes, so
# it stays on a plain, widely supported compose feature set and boots the real images
# (ADR-0018). The developer inner loop lives in `docker-compose.dev.yml` and never touches
# this one.
#
# At M0-P3 it contains only Postgres. P8 extends this same file with the API, the web app,
# the migrate+seed one-shot and the telemetry containers.

name: labelloop

services:
  postgres:
    # Never `:latest` (ADR-0011). Postgres is one of OUR containers in every environment
    # including production (ADR-0013), so which version is running is not a detail we get
    # to leave to whatever the registry served that morning.
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      # A throwaway local database with a self-describing placeholder, so a fresh clone
      # boots with zero secrets to supply (ADR-0009). Production sets this for real.
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-localdev}
      POSTGRES_DB: labelloop
    ports:
      # Published so the host's `bun run db:migrate`, `db:seed` and tests can reach it
      # while the API still runs on the host. From P8 the API reaches Postgres over the
      # compose network instead, so this mapping is a developer convenience rather than
      # part of the running system.
      #
      # 5433 rather than 5432 ON PURPOSE. A developer machine very often already has a
      # Postgres on 5432 — a Homebrew install, another project's container — and the
      # collision does not announce itself: the container binds `*:5432` while a local
      # install binds `127.0.0.1:5432`, the loopback address wins, and `bun run db:migrate`
      # cheerfully connects to the WRONG DATABASE and fails on a missing role. Defaulting
      # off the crowded port makes a fresh clone work on a machine that is already busy.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      # A named volume, not a bind mount: bind-mounting a database directory across the
      # macOS VM boundary is slow and, with the wrong ownership, silently broken.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # `depends_on: condition: service_healthy` gates the migrate one-shot on this at P8.
      # "The container started" is not "Postgres accepts connections" — initdb runs first.
      test: ['CMD-SHELL', 'pg_isready -U postgres -d labelloop']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
