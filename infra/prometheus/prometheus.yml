# Prometheus. At M0 it scraped the observability stack ITSELF and nothing else, because the
# API emitted no metrics. M3 adds the application, and — as that header predicted — it does
# so by adding a TARGET rather than a service: the API still exports OTLP to the one
# collector endpoint it knows about, and the collector republishes those series on a port
# this file scrapes (ADR-0041).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
    # The series that say whether spans are being lost between the API and Tempo:
    # `otelcol_receiver_accepted_spans` against `otelcol_exporter_sent_spans` is the
    # end-to-end count, and `otelcol_receiver_refused_spans` /
    # `otelcol_exporter_send_failed_spans` are where the difference goes. Verified against
    # a running collector rather than copied from documentation — 0.159 publishes these
    # without the `_total` suffix older examples use.

  # **The application's own metrics** (M3). Not the collector's health — that is the job
  # above — but `labelloop_*` and the HTTP and gen_ai series the API emits, republished by
  # the collector's `prometheus` exporter on its second port.
  #
  # The API is NEVER a target here. It does not serve a `/metrics` endpoint and is not
  # going to: it exports OTLP to one place, which is what makes swapping a backend a change
  # to the collector's configuration rather than to the application's.
  - job_name: labelloop-api
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

# Still no rule files here. M3's one alert rule (ADR-0043) is provisioned as Grafana-managed
# alerting alongside the dashboards, so it lives with the panel it is about rather than in a
# second alerting system that would need its own notification path to be worth having.
#
# Prometheus is started with `--web.enable-remote-write-receiver` (see the compose file).
# That is for TEMPO's `metrics_generator`, which remote-writes span-derived RED metrics so
# Grafana's Traces Drilldown works. Those series are explicitly NOT authoritative and no
# dashboard is built on them (ADR-0041) — the `source="tempo"` label they carry is how to
# tell them apart from the application's own.
