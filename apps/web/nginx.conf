# The console's server config. Mounted at /etc/nginx/conf.d/default.conf, replacing the
# image's own default server block.
#
# It does four things, and the third and fourth are the ones worth reading.

server {
    # 8080, not 80. This runs as an unprivileged user, which cannot bind a port below 1024,
    # and it is the port the base image already expects.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression, which is the reason this file exists at all. The console's bundle is
    # ~433 kB and ~137 kB gzipped, and the hand-rolled server it replaced sent all 433 kB
    # to every visitor because nothing in Bun does this for you.
    gzip on;
    gzip_vary on;
    # Below about a kilobyte the header overhead and the CPU are not worth it.
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Nothing here sniffs, and saying so is free.
    add_header X-Content-Type-Options "nosniff" always;

    # Vite fingerprints everything under assets/, so a given name can never change contents
    # and is cached for a year.
    #
    # The `=404` matters and is the whole reason this is a separate location. A MISSING
    # fingerprinted asset must be a real 404 and must NOT fall through to index.html — a
    # browser handed `<!doctype html>` where it expected JavaScript reports a syntax error,
    # which is a long way from the truth and sends whoever is debugging it somewhere else
    # entirely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Everything else is a client route — TanStack Router owns them — so the SPA shell is
    # the right answer, including for a URL that does not exist, which the router renders as
    # its own not-found rather than the server guessing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell is the document naming the current fingerprints, so a cached copy is exactly
    # how a browser ends up asking for a bundle that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
