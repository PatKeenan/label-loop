name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a standing Release PR carrying the version bump and CHANGELOG.
      # Merging that PR is the "ship it" gesture (ADR-0011). Versions are never
      # written by hand.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
