name: normalize-bot-pr-title

# Dependabot titles its PRs "ci: Bump x from 1 to 2". The type is ours (dependabot.yml
# sets the prefix) but the capital B fails commitlint's subject-case rule, and Dependabot
# exposes no knob for the subject. With squash-only merges taking their message from the
# PR title, the title IS the commit that lands on main and that release-please parses —
# so normalising it here fixes the mainline commit, not just a check.

on:
  pull_request_target:
    types: [opened, reopened, edited]

# Editing the title is the only thing this workflow may do.
permissions:
  pull-requests: write

# pull_request_target runs against the BASE ref with a write token. That is safe only
# because nothing below checks out or executes the head ref. Do not add a checkout step.

jobs:
  normalize:
    name: lowercase the subject
    if: endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite the title if its subject is capitalised
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Via env, never inlined into the script: a PR title is attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # type(scope)!: Subject -> type(scope)!: subject.
          # Requires <upper><lower> so acronyms survive: "fix: API timeout" is left alone.
          # tr rather than ${x,,} so the logic is identical under bash 3.2 and can be
          # exercised on a dev machine, not only on the runner.
          if [[ "$PR_TITLE" =~ ^([a-z]+(\([^\)]+\))?!?:[[:space:]])([A-Z])([a-z].*)$ ]]; then
            head="${BASH_REMATCH[1]}"
            initial="${BASH_REMATCH[3]}"
            tail="${BASH_REMATCH[4]}"
            normalized="${head}$(printf '%s' "$initial" | tr '[:upper:]' '[:lower:]')${tail}"
          else
            normalized="$PR_TITLE"
          fi

          if [[ "$normalized" == "$PR_TITLE" ]]; then
            echo "Title already conforms — nothing to do."
            echo "  $PR_TITLE"
            exit 0
          fi

          echo "Rewriting PR title:"
          echo "  from: $PR_TITLE"
          echo "    to: $normalized"
          # This fires another `edited` event; the second pass is a no-op, so no loop.
          gh pr edit "$PR_NUMBER" --title "$normalized"
