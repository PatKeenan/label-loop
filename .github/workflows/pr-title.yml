name: pr-title

# Under squash-only merges the PR title becomes the commit message on main, which is what
# release-please parses to derive the version and the CHANGELOG (ADR-0011). Linting the
# title is therefore linting the thing that actually ships; the branch's individual
# commits are scratch work and never reach main.
#
# This workflow used to also REWRITE bot titles to satisfy commitlint's subject-case rule.
# That could not work: Dependabot reasserts its own title on every rebase, and every push
# to main triggers a rebase, so our rewrite and Dependabot's undo fought each other and
# each move fired more runs. The rule was relaxed instead (commitlint.config.js) and the
# rewrite deleted. Nothing here modifies the pull request.
#
# pull_request_target rather than pull_request only because it resolves the workflow from
# the BASE ref, so changes here apply to already-open PRs without rebasing them. It holds
# no write permission and checks out the base ref, so no head-ref code ever runs.

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

# Serialised per PR, but NOT cancel-in-progress: a cancelled run leaves a CANCELLED check
# that nothing supersedes, which is exactly what happened during the rewrite experiment.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  lint-title:
    name: conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Lint the PR title
        env:
          # Via env, never inlined into the script: a PR title is attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint --verbose
