name: ci

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; a new push supersedes the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The container's Bun is the authoritative runtime (plan D-K); CI tracks that number
  # so the committed bun.lock cannot drift between host, CI, and image. Never "latest".
  BUN_VERSION: 1.4.0

jobs:
  quality:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    # The database tests deliberately do not skip when there is no Postgres: the
    # append-only guarantee and the migrator/app privilege split are claims about what
    # POSTGRES does, and a test that silently skips would report them green while proving
    # nothing. So CI runs a real one, on the same image tag compose pins.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          # A throwaway runner database. Self-describing and low-entropy on purpose — a
          # realistic-looking literal here is indistinguishable from a leaked credential,
          # to the secret scanner and to a reader.
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: labelloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d labelloop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # 5432 here rather than compose's 5433: a runner has nothing else on the port, and
      # the value that matters is that all three roles point at the same database.
      DATABASE_URL: postgres://labelloop_app:localdev@localhost:5432/labelloop
      DATABASE_MIGRATION_URL: postgres://labelloop_migrator:localdev@localhost:5432/labelloop
      DATABASE_ADMIN_URL: postgres://postgres:localdev@localhost:5432/labelloop

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Create the database roles
        # The only step that uses the superuser connection, exactly as it is locally.
        run: bun run db:bootstrap
      - name: Migrate
        run: bun run db:migrate
      - name: Seed
        # The relation-graph test traverses the seeded fixtures, and seeding here also puts
        # the seed itself under test — it is what the README's walkthrough depends on.
        run: bun run db:seed
      - name: Test
        run: bun run test
      - name: Build the console
        # Typechecking apps/web is not the same as building it: Vite resolves imports,
        # inlines `import.meta.env`, and bundles for a browser, and each of those can fail
        # on code `tsc` is perfectly happy with. The plan put every build in P8; this one
        # moved forward because P7 is where the app it builds started existing.
        run: bun run --cwd apps/web build

  commit-messages:
    name: conventional commits (main)
    runs-on: ubuntu-latest
    # PR *titles* are linted by pr-title.yml, because under squash-only merges the title
    # is the commit that lands. This job covers the other way onto main — a direct push —
    # which nothing in CI checked before.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint the pushed commit messages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Branch created in this push — no range to compare."
            exit 0
          fi
          bunx commitlint --from "$BEFORE" --to "$AFTER" --verbose

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
