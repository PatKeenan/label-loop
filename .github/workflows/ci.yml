name: ci

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; a new push supersedes the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The container's Bun is the authoritative runtime (plan D-K); CI tracks that number
  # so the committed bun.lock cannot drift between host, CI, and image. Never "latest".
  BUN_VERSION: 1.4.0

jobs:
  quality:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test

  commit-messages:
    name: conventional commits (main)
    runs-on: ubuntu-latest
    # PR *titles* are linted by pr-title.yml, because under squash-only merges the title
    # is the commit that lands. This job covers the other way onto main — a direct push —
    # which nothing in CI checked before.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint the pushed commit messages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Branch created in this push — no range to compare."
            exit 0
          fi
          bunx commitlint --from "$BEFORE" --to "$AFTER" --verbose

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
